<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindYourFeeling</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      padding: 32px 18px;
      background: #f7f4fb;
      color: #292733;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 12px 36px rgba(62, 60, 101, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #625c92;
    }

    a {
      color: #625c92;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #17161c;
        color: #f2eff8;
      }

      main {
        background: #232129;
        box-shadow: none;
      }

      h1, a {
        color: #c4bdef;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>FindYourFeeling</h1>
    <p>
      This GitHub Pages site only publishes the public app information that needs
      to stay online outside of the mobile app repository.

    <ul>
      <li><a href="./privacyPolicy.html">Privacy Policy</a></li>
      <li><a href="https://github.com/Plemoo/FindYourFeeling">Repository</a></li>

</html>
